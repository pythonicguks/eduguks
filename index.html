<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fusée des Nombres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one-screen app. A vertical star map of planets (one per skill); each mission is a cockpit with the calculation, a rocket progress track and a big keypad. */
:root{
  --night:#12163a; --night-2:#1b2155; --panel:#242b69; --line:#3b4494;
  --ink:#f5f3ff; --ink-soft:#b7bbe9;
  --star:#ffd23f; --silver:#cfd6ee; --rocket:#ff7a59; --mint:#53e0b0; --sky:#6cc4ff;
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);background-image:radial-gradient(120% 70% at 50% 0%,var(--night-2) 0%,var(--night) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--star);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}

#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--ink);opacity:.5;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.1}}

.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:20px;min-height:100%}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
.chip .s{color:var(--star)}
.chip .f{color:var(--rocket)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;background:var(--panel);font-family:var(--display);font-weight:700;font-size:17px}
.iconbtn:hover{background:var(--line)}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:14px}
.hero h1{font-size:clamp(38px,9vw,56px);font-weight:800;letter-spacing:-.5px}
.hero h1 span{color:var(--star)}
.hero svg{width:84px;flex:none;transform:rotate(-30deg)}
.hello{color:var(--ink-soft);margin:4px 0 0}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:22px;background:var(--rocket);color:var(--night);text-align:left;box-shadow:0 6px 0 #c4502f}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #c4502f}
.cta b{font-family:var(--display);font-size:26px;display:block;line-height:1}
.cta small{font-size:16px;font-weight:700}
.cta .go{font-family:var(--display);font-weight:800;font-size:34px;white-space:nowrap}
.review{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;border:2px dashed var(--sky);color:var(--sky);font-weight:700;text-align:left}

.map{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:relative}
.map::before{content:"";position:absolute;left:44px;top:40px;bottom:40px;border-left:4px dotted var(--line)}
.map li{display:flex;align-items:center;gap:10px}
.stop{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:8px;border-radius:24px;text-align:left}
.chrono{flex:none;width:96px;align-self:stretch;margin-block:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;border-radius:20px;border:2px solid var(--sky);color:var(--sky);font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;text-align:center}
.chrono:not([disabled]):hover{background:rgba(108,196,255,.1)}
.chrono[disabled]{border-color:var(--line);color:var(--ink-soft);font-family:var(--body);font-weight:400;font-size:13px;cursor:default}
.chrono .best{color:var(--ink);font-size:19px;font-variant-numeric:tabular-nums}
.medals{display:flex;gap:4px}
.medals i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.medals i.silver{background:var(--silver);border-color:var(--silver)}
.medals i.gold{background:var(--star);border-color:var(--star)}
.stop:not([disabled]):hover{background:rgba(255,255,255,.05)}
.stop[disabled]{cursor:default}
.planet{position:relative;flex:none;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--c1),var(--c2) 70%);box-shadow:inset -8px -8px 0 rgba(0,0,0,.18),0 0 0 6px var(--night)}
.planet.ring::after{content:"";position:absolute;left:-14px;right:-14px;top:30px;height:16px;border-radius:50%;border:4px solid var(--c1);transform:rotate(-14deg);opacity:.85}
.stop[disabled] .planet{filter:grayscale(1) brightness(.55)}
.lock{position:absolute;inset:0;display:grid;place-items:center}
.stop .t{min-width:0}
.stop .n{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.stop .k{font-size:15px;color:var(--ink-soft)}
.stop .ex{font-family:var(--display);font-weight:700;font-size:17px;color:var(--sky)}
.stars{color:var(--line);font-size:20px;letter-spacing:2px;line-height:1}
.stars .on{color:var(--star)}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.foot .iconbtn{flex:1;justify-content:center}

/* ---------- game ---------- */
.track{position:relative;height:44px;margin-inline:4px 34px}
.track .rail{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:var(--line)}
.track .dots{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}
.track .dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--night)}
.track .dot.ok{background:var(--mint)}
.track .dot.half{background:var(--star)}
.track .dot.miss{background:var(--rocket)}
.track .ship{position:absolute;top:6px;width:52px;margin-left:-26px;transition:left .6s cubic-bezier(.3,1.4,.6,1)}
.track .goal{position:absolute;right:-34px;top:4px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--c1),var(--c2) 70%)}

.qcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px 18px;border-radius:28px;background:var(--panel);text-align:center}
.qcount{font-size:15px;color:var(--ink-soft);font-weight:700}
.calc{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,72px);line-height:1;display:flex;align-items:center;gap:.22em;justify-content:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard.compact{padding:12px 12px 10px;gap:4px}
.qcard.compact .calc{font-size:clamp(32px,9vw,52px)}
.qcard.compact .msg{min-height:0;font-size:17px}
.app.playing{gap:14px}
.gamebar{flex-wrap:nowrap}
.gamebar .chip{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.gamebar .iconbtn{flex:none}
/* clavier toujours visible en bas de l'écran ; l'aide défile au-dessus */
.dock{position:sticky;bottom:0;z-index:2;margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--night);box-shadow:0 -12px 16px -8px var(--night)}
.calc .op{color:var(--sky)}
.answer{min-width:1.8em;padding:.05em .2em;border-radius:18px;border:4px dashed var(--ink-soft);color:var(--star);text-align:center}
.answer.empty{color:var(--line)}
.answer.good{border-style:solid;border-color:var(--mint);color:var(--mint);animation:pop .4s}
.answer.bad{border-style:solid;border-color:var(--rocket);color:var(--rocket);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:1.5em;font-weight:700;font-size:19px;text-align:center}
.msg.good{color:var(--mint)} .msg.bad{color:var(--rocket)}

.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toolbtn{padding:8px 16px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:16px}
.toolbtn[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--night)}

.aid{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;border-radius:22px;border:2px solid var(--line)}
.blocks{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.grp{display:flex;flex-direction:column;align-items:center;gap:6px}
.grp{min-width:0}
.grp .cubes{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap;justify-content:center;max-width:220px}
.grp .lbl{font-size:14px;color:var(--ink-soft);text-align:center}
.ten{width:12px;height:80px;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--sky) 0 7px,var(--night-2) 7px 8px)}
.units{display:grid;grid-template-columns:repeat(5,12px);gap:1px}
.one{width:12px;height:12px;border-radius:2px;background:var(--star)}
.grp.minus .one,.grp.minus .ten{opacity:.9}
.bigop{font-family:var(--display);font-weight:800;font-size:34px;color:var(--sky);align-self:center}

.col{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.1;display:grid;grid-template-columns:repeat(3,1.1em);text-align:center;font-variant-numeric:tabular-nums}
.col .carry{font-size:22px;color:var(--rocket);align-self:end}
.col .x{text-decoration:line-through;text-decoration-color:var(--rocket);text-decoration-thickness:3px;color:var(--ink-soft)}
.col sup{font-size:.5em;color:var(--rocket);vertical-align:.7em}
.col .rule{grid-column:1/-1;height:4px;border-radius:2px;background:var(--ink);margin:4px 0}
.col .res{color:var(--mint)}
.col .tens{color:var(--sky)}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;max-width:34em}
.aid.cols{flex-direction:row;align-items:center;justify-content:center;gap:18px}
.explain{display:flex;flex-direction:column;gap:8px;min-width:0}
.legend{font-size:14px;color:var(--ink-soft)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:64px;border-radius:18px;background:var(--panel);font-family:var(--display);font-weight:800;font-size:32px;box-shadow:0 5px 0 var(--night-2)}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--night-2)}
.key.del{color:var(--ink-soft);font-size:26px}
.key.ok{background:var(--mint);color:var(--night);box-shadow:0 5px 0 #2a9f7a}
.key.ok:disabled{opacity:.4}
.next{width:100%;min-height:64px;padding:8px 14px;line-height:1.1;border-radius:18px;background:var(--star);color:var(--night);font-family:var(--display);font-weight:800;font-size:26px;box-shadow:0 5px 0 #c19a12}

/* ---------- result ---------- */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:12px}
.result h2{font-size:clamp(34px,8vw,46px)}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:72px;height:72px}
.bigstars .on{animation:pop .5s backwards}
.bigstars .on:nth-child(2){animation-delay:.25s}
.bigstars .on:nth-child(3){animation-delay:.5s}
.facts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.fact{padding:10px 16px;border-radius:16px;background:var(--panel);min-width:130px}
.fact b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:var(--star)}
.fact span{font-size:15px;color:var(--ink-soft)}
.gift{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:22px;border:2px solid var(--star);text-align:left}
.gift svg{width:84px;height:84px;flex:none}
.gift .ship-art svg{width:120px;height:60px}
.actions{display:flex;flex-direction:column;gap:12px;width:100%}

/* ---------- album ---------- */
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:20px;background:var(--panel);text-align:center}
.slot svg{width:100%;max-width:96px;aspect-ratio:1}
.slot .n{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.1}
.slot.empty svg{opacity:.25;filter:grayscale(1)}
.slot.gold{box-shadow:inset 0 0 0 3px var(--star)}
.note{color:var(--ink-soft);font-size:16px;margin:0}
.hangar{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bay{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:20px;background:var(--panel);text-align:center;border:3px solid transparent}
.bay svg{width:100%;max-width:150px;aspect-ratio:2/1}
.bay .n{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1}
.bay .st{font-size:14px;color:var(--ink-soft)}
.bay.locked svg{opacity:.25;filter:grayscale(1) brightness(.6)}
.bay.locked{cursor:default}
.bay.on{border-color:var(--mint)}
.bay.on .st{color:var(--mint);font-weight:700}
.clock{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--star);font-variant-numeric:tabular-nums}
.goals{font-size:15px;color:var(--ink-soft)}
.bigtime{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,84px);line-height:1;color:var(--star);font-variant-numeric:tabular-nums}
.targets{display:flex;flex-direction:column;gap:6px;align-items:stretch;width:100%;max-width:340px}
.target{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-radius:14px;background:var(--panel);font-weight:700}
.target.hit{box-shadow:inset 0 0 0 2px var(--mint);color:var(--mint)}
.gift .ship-art{width:120px;flex:none}

/* ---------- parents ---------- */
.parents{display:flex;flex-direction:column;gap:18px}
.parents h2{font-size:32px}
.parents h3{font-size:22px;margin-bottom:8px}
.box{padding:16px;border-radius:20px;background:var(--panel);min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
td.num{text-align:right;white-space:nowrap}
.meter{display:inline-block;width:52px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint)}
.errs{display:flex;flex-wrap:wrap;gap:8px}
.err{padding:4px 10px;border-radius:10px;background:var(--night-2);font-family:var(--display);font-weight:700}
.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field input{flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--night);color:var(--ink);font:inherit}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:16px}
.danger{color:var(--rocket);border:2px solid var(--rocket);padding:8px 14px;border-radius:12px;font-weight:700}
.danger.solid{background:var(--rocket);color:var(--night)}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

.ship .flame{animation:flick .15s infinite alternate}
@keyframes flick{to{transform:scaleX(1.35);transform-origin:right center}}

@media (max-width:480px){
  .aid{padding:10px;gap:8px}
  .aid.cols{gap:10px}
  .col{font-size:28px}
  .col .carry{font-size:17px}
  .steps{font-size:15px;line-height:1.35;padding-left:1.2em}
  .blocks{gap:8px}
  .grp .lbl{font-size:12px}
  .ten{width:8px;height:52px;background:repeating-linear-gradient(to bottom,var(--sky) 0 4.2px,var(--night-2) 4.2px 5.2px)}
  .units{grid-template-columns:repeat(5,8px)}
  .one{width:8px;height:8px}
  .grp .cubes{gap:3px;max-width:120px}
  .bigop{font-size:26px}
  .track{height:34px}
  .track .rail{top:15px}
  .track .ship{top:2px;width:44px;margin-left:-22px}
  .track .goal{top:2px;width:30px;height:30px;right:-32px}
  .tools .toolbtn{padding:6px 12px;font-size:15px}
  .pad{gap:8px}
}
@media (max-width:420px){
  .key{height:52px;font-size:28px}
  .planet{width:64px;height:64px}
  .map::before{left:38px}
  .stop{gap:10px}
  .chrono{width:84px}
  .stop .n{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div id="sky" aria-hidden="true"></div>
<main class="app" id="app"></main>

<script>
(function(){
"use strict";

/* =========================================================
   Niveaux : une planète = une compétence du programme de CE1
   ========================================================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const Q=(a,op,b)=>({a,op,b});

const GEN={
  // 30 + 40, 80 − 50
  tens(){ if(Math.random()<.6){const ta=rnd(1,8);return Q(ta*10,'+',rnd(1,9-ta)*10)} const ta=rnd(2,9);return Q(ta*10,'-',rnd(1,ta-1)*10) },
  // 34 + 5 (sans retenue)
  addSmall(){ const u=rnd(0,8);return Q(rnd(1,8)*10+u,'+',rnd(1,9-u)) },
  // 23 + 45 (sans retenue)
  add2(){ const ua=rnd(0,8),ub=rnd(1,9-ua),ta=rnd(1,8),tb=rnd(1,9-ta);return Q(ta*10+ua,'+',tb*10+ub) },
  // 58 − 23 ou 47 − 5 (sans échange)
  subSimple(){ if(Math.random()<.3){const ua=rnd(1,9);return Q(rnd(1,9)*10+ua,'-',rnd(1,ua))} const ta=rnd(2,9),ua=rnd(0,9);return Q(ta*10+ua,'-',rnd(1,ta-1)*10+rnd(0,ua)) },
  // 27 + 5 (on passe la dizaine)
  addCross(){ const ua=rnd(2,9);return Q(rnd(1,8)*10+ua,'+',rnd(10-ua,9)) },
  // 38 + 47 (avec retenue)
  addCarry(){ const ua=rnd(1,9),ub=rnd(Math.max(1,10-ua),9),ta=rnd(1,7),tb=rnd(1,8-ta);return Q(ta*10+ua,'+',tb*10+ub) },
  // 42 − 7 (on recule sous la dizaine)
  subCross(){ const ua=rnd(0,8);return Q(rnd(2,9)*10+ua,'-',rnd(ua+1,9)) },
  // 63 − 28 (avec échange)
  subBorrow(){ const ta=rnd(2,9),ua=rnd(0,8);return Q(ta*10+ua,'-',rnd(1,ta-1)*10+rnd(ua+1,9)) },
};
GEN.mix=()=>pick([GEN.add2,GEN.addCarry,GEN.addCarry,GEN.addCross,GEN.subSimple,GEN.subCross,GEN.subBorrow,GEN.subBorrow])();

const LEVELS=[
  {id:'tens',     name:'Lunette',      skill:'Les dizaines rondes',        ex:'30 + 40',  c1:'#c3cfff',c2:'#4b5bd6',silver:60,gold:35},
  {id:'addSmall', name:'Pétilla',      skill:'Ajouter des unités',         ex:'34 + 5',   c1:'#ffe6a8',c2:'#e89a2c',ring:true,silver:60,gold:35},
  {id:'add2',     name:'Bulle-Bleue',  skill:'Dizaines et unités',         ex:'23 + 45',  c1:'#b5efff',c2:'#2a8fc7',silver:75,gold:45},
  {id:'subSimple',name:'Cratéra',      skill:'Soustraire sans échange',    ex:'58 − 23',  c1:'#e6d9ff',c2:'#7d55d9',silver:80,gold:50},
  {id:'addCross', name:'Rocha',        skill:'Passer la dizaine',          ex:'27 + 5',   c1:'#ffc9b8',c2:'#e0573a',ring:true,silver:80,gold:50},
  {id:'addCarry', name:'Volcania',     skill:'Additions avec retenue',     ex:'38 + 47',  c1:'#ffc2d2',c2:'#c23a6b',silver:100,gold:65},
  {id:'subCross', name:'Glaçon',       skill:'Reculer sous la dizaine',    ex:'42 − 7',   c1:'#d6fff3',c2:'#2fb58e',silver:90,gold:60},
  {id:'subBorrow',name:'Nébula',       skill:'Soustractions avec échange', ex:'63 − 28',  c1:'#f7ccff',c2:'#9a3fc2',ring:true,silver:120,gold:80},
  {id:'mix',      name:'Étoile Royale',skill:'Le grand défi',              ex:'tout mélangé',c1:'#fff4b8',c2:'#e0a800',silver:120,gold:80},
];
const QUESTIONS=10;
const REVIEW_MAX=8;

const KEY='fusee-des-nombres-v1';
const fresh=()=>({v:1,name:'',sound:true,levels:{},stats:{},errors:[],stickers:{},lastDay:'',dayStreak:0,times:{},rockets:{},ship:'base'});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)S=Object.assign(fresh(),s)}catch(e){}

const starsOf=id=>(S.levels[id]&&S.levels[id].stars)||0;
const unlocked=i=>i===0||starsOf(LEVELS[i-1].id)>=1;
const totalStars=()=>LEVELS.reduce((n,l)=>n+starsOf(l.id),0);
const res=q=>q.op==='+'?q.a+q.b:q.a-q.b;
const sign=op=>op==='+'?'+':'−';
const qkey=q=>q.a+q.op+q.b;
const dayStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function touchDay(){const t=dayStr(new Date()),y=new Date();y.setDate(y.getDate()-1);if(S.lastDay!==t){S.dayStreak=S.lastDay===dayStr(y)?S.dayStreak+1:1;S.lastDay=t}}
const fmt=ms=>(Math.floor(ms/100)/10).toFixed(1).replace('.',',')+' s';
const chronoOpen=id=>starsOf(id)>=1;
function currentStreak(){const t=dayStr(new Date()),y=new Date();y.setDate(y.getDate()-1);return (S.lastDay===t||S.lastDay===dayStr(y))?S.dayStreak:0}

/* =========================================================
   Sons (après un premier toucher)

let actx=null;
function tone(freqs,dur,type){
  if(!S.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*dur;
      o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.05)});
  }catch(e){}
}
const sfx={good:()=>tone([660,880],.11),bad:()=>tone([220,180],.16,'triangle'),win:()=>tone([523,659,784,1047],.13),key:()=>tone([440],.04)};

/* aide visuelle : barres de dizaines et cubes d'unités */
function blocks(n,label){
  const t=Math.floor(n/10),u=n%10;
  let h=`<div class="grp"><div class="cubes">`;
  for(let i=0;i<t;i++)h+=`<span class="ten"></span>`;
  if(u){h+=`<span class="units">`;for(let i=0;i<u;i++)h+=`<span class="one"></span>`;h+=`</span>`}
  h+=`</div><div class="lbl"><b>${n}</b><br>${t} dizaine${t>1?'s':''}, ${u} unité${u>1?'s':''}${label?'<br>'+label:''}</div></div>`;
  return h;
}

/* calcul posé en colonnes + étapes ; reveal=false : indice, reveal=true : correction */
function column(q,reveal){
  const ta=Math.floor(q.a/10),ua=q.a%10,tb=Math.floor(q.b/10),ub=q.b%10,r=res(q),tr=Math.floor(r/10),ur=r%10;
  const add=q.op==='+',carry=add&&ua+ub>=10,borrow=!add&&ua<ub;
  const cell=(c,cls)=>`<span class="${cls||''}">${c}</span>`;
  let g='';
  // ligne des retenues / échanges
  g+=cell('')+cell(carry?'1':borrow?String(ta-1):'','carry')+cell('');
  g+=cell('')+cell(ta||'',borrow?'x tens':'tens')+cell(borrow?`<sup>1</sup>${ua}`:ua);
  g+=cell(sign(q.op),'tens')+cell(tb||'','tens')+cell(ub);
  g+=`<span class="rule"></span>`;
  g+=cell('')+cell(reveal?(tr||(r<10?'':'0')):'?','res')+cell(reveal?ur:'?','res');
  const S=[];
  if(ua===0&&ub===0){
    S.push(`Pense en dizaines : ${ta} dizaine${ta>1?'s':''} ${add?'+':'−'} ${tb} dizaine${tb>1?'s':''} = ${reveal?tr+' dizaine'+(tr>1?'s':''):'?'}.`);
    if(reveal)S.push(`Donc ${q.a} ${sign(q.op)} ${q.b} = <b>${r}</b>.`);
    return {grid:g,steps:S};
  }
  if(add){
    const su=ua+ub;
    if(reveal){
      S.push(carry?`Unités : ${ua} + ${ub} = ${su}. J'écris ${su-10} et je retiens 1 dizaine.`:`Unités : ${ua} + ${ub} = ${su}.`);
      S.push(tb?`Dizaines : ${ta} + ${tb}${carry?' + 1 (la retenue)':''} = ${tr}.`:(carry?`Dizaines : ${ta} + 1 (la retenue) = ${tr}.`:`Dizaines : le ${ta} descend.`));
      S.push(`Résultat : <b>${r}</b>.`);
    }else{
      S.push(`Commence par les unités : ${ua} + ${ub}.`);
      if(carry)S.push(`Tu trouves 10 ou plus ? Garde 1 dizaine en retenue, en haut.`);
      S.push(tb?`Puis les dizaines : ${ta} + ${tb}${carry?' + la retenue':''}.`:(carry?`Puis les dizaines : ${ta} + la retenue.`:`Les dizaines ne changent pas.`));
    }
  }else{
    if(reveal){
      S.push(borrow?`Unités : ${ua} − ${ub}, c'est trop petit ! J'échange 1 dizaine contre 10 unités : ${ua+10} − ${ub} = ${ua+10-ub}.`:`Unités : ${ua} − ${ub} = ${ua-ub}.`);
      const tt=borrow?ta-1:ta;
      S.push(borrow?`Il reste ${tt} dizaine${tt>1?'s':''}. ${tb?`${tt} − ${tb} = ${tr}.`:''}`:(tb?`Dizaines : ${ta} − ${tb} = ${tr}.`:`Dizaines : le ${ta} descend.`));
      S.push(`Résultat : <b>${r}</b>.`);
    }else{
      S.push(`Commence par les unités : ${ua} − ${ub}.`);
      if(borrow)S.push(`${ua} est plus petit que ${ub} ! Échange 1 dizaine contre 10 unités : tu calcules ${ua+10} − ${ub}.`);
      S.push(borrow?`Il ne reste plus que ${ta-1} dizaine${ta-1>1?'s':''}${tb?` : calcule ${ta-1} − ${tb}`:''}.`:(tb?`Puis les dizaines : ${ta} − ${tb}.`:`Les dizaines ne changent pas.`));
    }
  }
  return {grid:g,steps:S};
}

   Missions
   ========================================================= */
let M=null;   // mission en cours
let screen='home';

function buildMission(lvId,timed){
  const qs=[],seen=new Set();
  // réparation : uniquement les calculs ratés, du plus facile au plus difficile
  const bank=timed?[]:lvId==='review'?S.errors.slice().sort((x,y)=>lvOrder(x.lv)-lvOrder(y.lv)).slice(0,REVIEW_MAX):S.errors.filter(e=>e.lv===lvId).slice(-3);
  bank.forEach(e=>{if(!seen.has(qkey(e))){seen.add(qkey(e));qs.push({a:e.a,op:e.op,b:e.b,lv:e.lv,review:true})}});
  const gen=GEN[lvId]||GEN.mix;
  let guard=0;
  while(lvId!=='review'&&qs.length<QUESTIONS&&guard++<500){const q=gen();if(seen.has(qkey(q)))continue;seen.add(qkey(q));q.lv=lvId==='review'?'mix':lvId;qs.push(q)}
  if(lvId!=='review')for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
  return {lv:lvId,qs,i:0,tries:0,input:'',pts:0,first:0,streak:0,best:0,marks:[],aid:qs[0]&&qs[0].review?'hint':false,phase:'ask',msg:'',msgCls:'',
    timed:!!timed,elapsed:0,penalty:0,errs:0,tick:performance.now()};
}
function startMission(lvId,timed){M=buildMission(lvId,timed);screen='game';render()}
/* temps du chrono : il ne tourne que pendant qu'une question attend sa réponse */
function clockMs(){return M.elapsed+M.penalty+(M.phase==='ask'&&!M.paused?performance.now()-M.tick:0)}

function addError(q){
  if(!S.errors.some(e=>qkey(e)===qkey(q)))S.errors.push({lv:q.lv,a:q.a,op:q.op,b:q.b});
  if(S.errors.length>40)S.errors.shift();
}
function removeError(q){S.errors=S.errors.filter(e=>qkey(e)!==qkey(q))}
function stat(lv){return S.stats[lv]||(S.stats[lv]={q:0,first:0,missions:0})}

const CHEERS=['Bravo !','Super calcul !','Exact !','Génial !','Bien joué !','Parfait !','Champion !'];
function cheer(){const c=pick(CHEERS);return S.name&&Math.random()<.35?c.replace(' !',`, ${S.name} !`):c}

function submit(){
  if(M.phase!=='ask'||!M.input)return;
  const q=M.qs[M.i],v=parseInt(M.input,10),st=stat(q.lv);
  if(M.timed){
    M.elapsed+=performance.now()-M.tick;
    if(v===res(q)){M.first++;M.streak++;M.best=Math.max(M.best,M.streak);M.marks[M.i]='ok';M.phase='good';M.msg=pick(['Vite et juste !','Bien !','Exact !','Ça file !']);M.msgCls='good';sfx.good()}
    else{M.penalty+=5000;M.errs++;M.streak=0;M.marks[M.i]='miss';M.phase='timedbad';M.msg=`+5 s · la bonne réponse était ${res(q)}`;M.msgCls='bad';sfx.bad()}
    save();render();const m=M;setTimeout(()=>{if(M===m)nextQ()},M.phase==='good'?450:1700);
    return;
  }
  if(M.tries===0)st.q++;
  if(v===res(q)){
    if(M.tries===0){M.pts+=1;M.first++;st.first++;M.streak++;M.best=Math.max(M.best,M.streak);M.marks[M.i]='ok';if(q.review)removeError(q)}
    else{M.pts+=.5;M.streak=0;M.marks[M.i]='half'}
    M.phase='good';
    M.msg=M.streak>=3&&M.streak%2===1?`${M.streak} bonnes réponses d'affilée, la fusée accélère !`:(M.tries?'Oui ! Tu as trouvé.':cheer());
    M.msgCls='good';sfx.good();save();render();
    const m=M;setTimeout(()=>{if(M===m)nextQ()},M.tries?1100:900);
  }else{
    M.tries++;M.streak=0;addError(q);sfx.bad();
    if(M.tries===1){M.phase='ask';M.aid='hint';M.msg='Presque ! Regarde l\'indice et réessaie.';M.msgCls='bad';M.wrong=M.input;M.input=''}
    else{M.phase='solution';M.aid='solution';M.marks[M.i]='miss';M.msg='Pas grave, voici comment on fait.';M.msgCls='bad';M.wrong=M.input}
    save();render();
  }
}
function nextQ(){
  if(!M||screen!=='game')return;
  M.i++;M.tries=0;M.input='';M.phase='ask';M.aid=M.qs[M.i]&&M.qs[M.i].review?'hint':false;M.msg='';M.msgCls='';M.wrong='';M.tick=performance.now();
  if(M.i>=M.qs.length)(M.timed?finishTimed:finish)();else render();
}
function finish(){
  const pts=M.pts,stars=pts>=9?3:pts>=7?2:pts>=5?1:0,lv=M.lv;
  const out={stars,pts,first:M.first,best:M.best,lv,n:M.qs.length,newSticker:null,unlockedNext:false};
  if(lv!=='review'){
    const L=S.levels[lv]||(S.levels[lv]={stars:0,plays:0});
    const idx=LEVELS.findIndex(l=>l.id===lv);
    const wasLocked=idx<LEVELS.length-1&&!unlocked(idx+1);
    L.plays++;if(stars>L.stars)L.stars=stars;
    stat(lv).missions++;
    if(stars>=1){const had=S.stickers[lv];const now=stars===3?'gold':'normal';if(!had||(had==='normal'&&now==='gold')){S.stickers[lv]=now;out.newSticker={idx,gold:now==='gold'}}}
    out.unlockedNext=wasLocked&&idx<LEVELS.length-1&&unlocked(idx+1);
  }
  touchDay();
  save();M.result=out;screen='result';
  const allFixed=lv==='review'&&M.first===M.qs.length;
  if(stars>=1||lv==='review')sfx.win();
  if(stars===3||allFixed)confetti();
  render();
}

function finishTimed(){
  const lv=M.lv,L=LEVELS.find(l=>l.id===lv),total=Math.round(M.elapsed+M.penalty);
  const prev=S.times[lv]||0,record=!prev||total<prev;
  if(record)S.times[lv]=total;
  const tier=total<=L.gold*1000?'gold':total<=L.silver*1000?'silver':null;
  const had=S.rockets[lv];let won=null;
  if(tier&&(!had||(had==='silver'&&tier==='gold'))){S.rockets[lv]=tier;S.ship=lv;won=tier}
  touchDay();save();
  M.result={timed:true,lv,total,prev,record,tier,won,errs:M.errs,first:M.first};screen='result';
  if(won||record)sfx.win();
  if(won)confetti();
  render();
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('div');c.className='confetti';
  const cols=['var(--star)','var(--rocket)','var(--mint)','var(--sky)'];
  for(let i=0;i<60;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%4];p.style.animationDelay=Math.random()*.8+'s';c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3500);
}

  const L=M.lv==='review'?{name:'Réparation',c1:'#cdeeff',c2:'#3b7fd1'}:LEVELS.find(l=>l.id===M.lv);
  const q=M.qs[M.i];
  const N=M.qs.length;
  let dots='';for(let i=0;i<N;i++)dots+=`<span class="dot ${M.marks[i]||''}"></span>`;
  const pos=N>1?(M.i/(N-1))*100:0;
  const ansCls=M.phase==='good'?'good':(M.phase==='solution'||M.phase==='timedbad'||(M.msgCls==='bad'&&!M.input))?'bad':'';
  const shown=(M.phase==='solution'||M.phase==='timedbad')?res(q):(M.input||'?');
  let h=`<div class="bar gamebar"><button class="iconbtn" data-nav="home" aria-label="Retour à la carte">← Carte</button><div class="grow"></div>
    <span class="chip" style="--c1:${L.c1}">${M.timed?'Chrono · ':''}${esc(L.name)}</span>
    <button class="iconbtn" data-act="sound" aria-label="${S.sound?'Couper le son':'Activer le son'}" aria-pressed="${S.sound}">${S.sound?'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'}</button></div>
  <div class="track" style="--c1:${L.c1};--c2:${L.c2}" aria-label="Question ${M.i+1} sur ${N}"><span class="rail"></span><span class="dots">${dots}</span><span class="ship" style="left:${pos}%">${myShip()}</span><span class="goal"></span></div>
  <section class="qcard ${M.aid?'compact':''}">
    ${M.timed?`<span class="clock" id="clock" aria-hidden="true">${fmt(clockMs())}</span><span class="goals">Calcul ${M.i+1} sur ${N} · fusée argent : ${L.silver} s · or : ${L.gold} s</span>`
      :`<span class="qcount">Calcul ${M.i+1} sur ${N}${q.review?' · à réparer':''}</span>`}
    <div class="calc" aria-live="polite"><span>${q.a}</span><span class="op">${sign(q.op)}</span><span>${q.b}</span><span class="op">=</span><span class="answer ${shown==='?'?'empty':''} ${ansCls}">${shown}</span></div>
    <div class="msg ${M.msgCls}" role="status">${esc(M.msg)}</div>
  </section>`;
  if(M.phase==='ask'&&!M.timed)h+=`<div class="tools"><button class="toolbtn" data-act="blocks" aria-pressed="${M.aid==='blocks'}">Voir les cubes</button><button class="toolbtn" data-act="cols" aria-pressed="${M.aid==='hint'}">Poser le calcul</button></div>`;
  if(M.aid==='blocks'){
    h+=`<div class="aid"><div class="blocks">${blocks(q.a)}<span class="bigop">${sign(q.op)}</span>${blocks(q.b,q.op==='-'?'à enlever':'')}</div>
      <span class="legend">Une barre bleue = 1 dizaine (10). Un cube jaune = 1 unité.</span></div>`;
  }else if(M.aid==='hint'||M.aid==='solution'){
    const c=column(q,M.aid==='solution');
    h+=`<div class="aid cols"><div class="col" aria-hidden="true">${c.grid}</div><div class="explain"><ol class="steps">${c.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      ${M.aid==='solution'&&M.wrong?`<span class="legend">Tu avais répondu ${esc(M.wrong)}. Ce calcul reviendra dans une prochaine mission.</span>`:''}</div></div>`;
  }
  if(M.phase==='solution')h+=`<div class="dock"><button class="next" data-act="next">J'ai compris, calcul suivant →</button></div>`;
  else{
    h+=`<div class="dock"><div class="pad">`;
    [1,2,3,4,5,6,7,8,9].forEach(n=>h+=`<button class="key" data-key="${n}">${n}</button>`);
    h+=`<button class="key del" data-key="del" aria-label="Effacer">⌫</button><button class="key" data-key="0">0</button><button class="key ok" data-key="ok" aria-label="Valider" ${M.input&&M.phase==='ask'?'':'disabled'}>✓</button></div></div>`;
  }
  return h;
}

function viewTimedResult(){
  const r=M.result,L=LEVELS.find(l=>l.id===r.lv);
  let h=`<div class="result"><div class="bigtime">${fmt(r.total)}</div>
    <h2>${r.won?'Nouvelle fusée !':r.record&&r.prev?'Nouveau record !':'Course terminée !'}</h2>
    <div class="facts"><div class="fact"><b>${r.first} / ${QUESTIONS}</b><span>calculs justes</span></div><div class="fact"><b>${r.errs?'+'+r.errs*5+' s':'0 s'}</b><span>de pénalités</span></div><div class="fact"><b>${fmt(S.times[r.lv])}</b><span>record</span></div></div>
    <div class="targets"><div class="target ${r.total<=L.silver*1000?'hit':''}"><span>Fusée argent</span><span>moins de ${L.silver} s ${r.total<=L.silver*1000?'✓':''}</span></div><div class="target ${r.total<=L.gold*1000?'hit':''}"><span>Fusée or</span><span>moins de ${L.gold} s ${r.total<=L.gold*1000?'✓':''}</span></div></div>`;
  if(r.won)h+=`<div class="gift"><span class="ship-art">${rocketSVG(r.lv,r.won==='gold')}</span><div><b>${r.won==='gold'?'Fusée dorée':'Fusée'} de ${esc(L.name)} gagnée !</b><br>Elle est déjà sur ta piste. Change de fusée dans le hangar.</div></div>`;
  else if(!r.tier)h+=`<p class="note">Encore ${fmt(r.total-L.silver*1000)} à gagner pour la fusée argent. Chaque erreur coûte 5 secondes : mieux vaut juste que trop vite !</p>`;
  else if(r.tier==='silver'&&S.rockets[r.lv]!=='gold')h+=`<p class="note">Encore ${fmt(r.total-L.gold*1000)} à gagner pour la fusée or.</p>`;
  h+=`<div class="actions"><button class="cta" data-chrono="${r.lv}" style="justify-content:center"><b>Rejouer le chrono</b></button><button class="iconbtn" data-nav="hangar" style="justify-content:center">Hangar des fusées</button><button class="iconbtn" data-nav="home" style="justify-content:center">Retour à la carte</button></div></div>`;
  return h;
}

function viewResult(){
  if(M.result.timed)return viewTimedResult();
  const r=M.result,L=LEVELS.find(l=>l.id===r.lv);
  const titles=['Encore un petit effort !','Mission réussie !','Très belle mission !','Mission parfaite !'];
  if(r.lv==='review'){
    const left=S.errors.length;
    return `<div class="result"><div class="gift" style="border-color:var(--mint)">${myShip().replace('<svg','<svg style="width:96px;height:48px"')}<div><b>Réparations terminées !</b><br>${r.first} calcul${r.first>1?'s':''} réparé${r.first>1?'s':''} sur ${r.n}.</div></div>
      <h2>${r.first===r.n?'La fusée est comme neuve !':'Bon travail de mécanicien !'}</h2>
      <p class="note">${left?`Encore ${left} calcul${left>1?'s':''} à réparer. ${left>1?'Ils reviendront':'Il reviendra'} dans les prochaines missions.`:'Plus aucun calcul à réparer. Bravo !'}</p>
      <div class="actions">${left?`<button class="cta" data-go="review" style="justify-content:center;text-align:center"><b>Continuer les réparations</b></button>`:''}<button class="iconbtn" data-nav="home" style="justify-content:center">Retour à la carte</button></div></div>`;
  }
  let h=`<div class="result"><div class="bigstars">${[0,1,2].map(i=>STAR(i<r.stars)).join('')}</div>
    <h2>${titles[r.stars]}</h2>
    <div class="facts"><div class="fact"><b>${r.first} / ${r.n}</b><span>du premier coup</span></div><div class="fact"><b>${r.best}</b><span>meilleure série</span></div></div>`;
  if(r.stars===0&&r.lv!=='review')h+=`<p class="note">Il faut au moins 5 points pour gagner une étoile. Utilise les cubes et le calcul posé, tu vas y arriver !</p>`;
  if(r.newSticker)h+=`<div class="gift">${alien(r.newSticker.idx,r.newSticker.gold)}<div><b>Nouvel alien ${r.newSticker.gold?'doré ':''}!</b><br>Les habitants de ${esc(LEVELS[r.newSticker.idx].name)} rejoignent ton album.</div></div>`;
  if(r.unlockedNext){const n=LEVELS[LEVELS.indexOf(L)+1];h+=`<p class="note">Nouvelle planète débloquée : <b style="color:var(--star)">${esc(n.name)}</b></p>`}
  h+=`<div class="actions">`;
  const idx=L?LEVELS.indexOf(L):-1;
  if(idx>=0&&idx<LEVELS.length-1&&unlocked(idx+1)&&r.stars>=1)h+=`<button class="next" data-go="${LEVELS[idx+1].id}">Planète suivante : ${esc(LEVELS[idx+1].name)} →</button>`;
  h+=`<button class="cta" data-go="${r.lv}" style="justify-content:center"><b>Rejouer</b></button><button class="iconbtn" data-nav="home" style="justify-content:center">Retour à la carte</button></div></div>`;
  return h;
}

function viewAlbum(){
  const n=Object.keys(S.stickers).length;
  let h=`<div class="bar"><button class="iconbtn" data-nav="home">← Carte</button></div><h2 style="font-size:36px">Album des aliens</h2>
  <p class="note">${n} alien${n>1?'s':''} sur ${LEVELS.length}. Gagne au moins 1 étoile sur une planète pour rencontrer ses habitants. Avec 3 étoiles, ils portent une couronne dorée !</p><div class="album">`;
  LEVELS.forEach((l,i)=>{const st=S.stickers[l.id];h+=`<div class="slot ${st?'':'empty'} ${st==='gold'?'gold':''}">${alien(i,st==='gold')}<span class="n">${st?esc(l.name):'???'}</span>${starsTxt(starsOf(l.id))}</div>`});
  return h+`</div>`;
}

function viewHangar(){
  const n=Object.keys(S.rockets).length;
  let h=`<div class="bar"><button class="iconbtn" data-nav="home">← Carte</button></div><h2 style="font-size:36px">Hangar des fusées</h2>
  <p class="note">${n} fusée${n>1?'s':''} gagnée${n>1?'s':''} sur ${LEVELS.length}. Bats le temps argent d'une planète en mode chrono pour gagner sa fusée, puis le temps or pour la version dorée. Touche une fusée pour monter à bord.</p><div class="hangar">`;
  h+=`<button class="bay ${S.ship==='base'||!S.rockets[S.ship]?'on':''}" data-ship="base">${ROCKET}<span class="n">Fusée de départ</span><span class="st">${S.ship==='base'||!S.rockets[S.ship]?'À bord ✓':'Disponible'}</span></button>`;
  LEVELS.forEach(l=>{const rk=S.rockets[l.id],on=S.ship===l.id&&rk;
    h+=rk?`<button class="bay ${on?'on':''}" data-ship="${l.id}">${rocketSVG(l.id,rk==='gold')}<span class="n">${esc(l.name)}${rk==='gold'?' (or)':''}</span><span class="st">${on?'À bord ✓':rk==='gold'?'Record '+fmt(S.times[l.id]):`Or : moins de ${l.gold} s`}</span></button>`
      :`<div class="bay locked">${rocketSVG(l.id,false)}<span class="n">${esc(l.name)}</span><span class="st">${chronoOpen(l.id)?`Chrono en moins de ${l.silver} s`:'Gagne 1 ★ sur la planète'}</span></div>`});
  return h+`</div>`;
}

let confirmReset=false;
function viewParents(){
  let h=`<div class="bar"><button class="iconbtn" data-nav="home">← Carte</button></div><div class="parents"><h2>Espace parents</h2>
  <div class="box"><h3>Prénom de l'astronaute</h3><div class="field"><input id="kidname" maxlength="20" placeholder="ex. Léo" value="${esc(S.name)}" aria-label="Prénom"><button class="iconbtn" data-act="savename">Enregistrer</button></div></div>
  <div class="box"><h3>Progression</h3><div class="tbl"><table><thead><tr><th>Planète</th><th>Compétence</th><th class="num">Missions</th><th class="num">1er essai</th><th>Étoiles</th><th class="num">Chrono</th></tr></thead><tbody>`;
  LEVELS.forEach(l=>{const st=S.stats[l.id]||{q:0,first:0,missions:0},p=st.q?Math.round(st.first/st.q*100):null;
    h+=`<tr><td>${esc(l.name)}</td><td>${esc(l.skill)}<br><span class="legend">${l.ex}</span></td><td class="num">${st.missions}</td><td class="num">${p===null?'–':`<span class="meter"><i style="width:${p}%"></i></span>${p} %`}</td><td>${starsTxt(starsOf(l.id))}</td><td class="num">${S.times[l.id]?fmt(S.times[l.id]):'–'}<br><span class="legend">${l.silver} / ${l.gold} s</span></td></tr>`});
  h+=`</tbody></table></div><p class="note" style="margin-top:10px">« 1er essai » = part des calculs justes sans aide de correction. Au-delà de 80 %, la compétence est bien installée. « Chrono » = meilleur temps, puis les objectifs argent / or.</p></div>`;
  h+=`<div class="box"><h3>Calculs à retravailler</h3>${S.errors.length?`<div class="errs">${S.errors.slice().reverse().map(e=>`<span class="err">${e.a} ${sign(e.op)} ${e.b} = ${res(e)}</span>`).join('')}</div><p class="note" style="margin-top:10px">Ces calculs reviennent automatiquement dans les missions. Ils disparaissent de la liste quand votre enfant les réussit du premier coup.</p>`:`<p class="note">Aucun pour l'instant.</p>`}</div>
  <div class="box"><h3>Conseils</h3><ul class="tips">
    <li>Une mission (10 calculs) dure 5 à 10 minutes. Une par jour suffit : la régularité compte plus que la durée.</li>
    <li>Une étoile débloque la planète suivante. Encouragez à revenir chercher les 3 étoiles : c'est là que l'automatisme se crée.</li>
    <li>Les boutons « Voir les cubes » et « Poser le calcul » sont libres d'accès. Laissez votre enfant les utiliser ; ils disparaissent d'eux-mêmes quand il n'en a plus besoin.</li>
    <li>Pour les soustractions avec retenue, le jeu montre la méthode par <b>échange</b> (« je casse une dizaine en 10 unités »). Si l'école utilise une autre méthode (compensation), privilégiez celle de l'enseignant.</li>
    <li>Le mode chrono s'ouvre dès 1 étoile. Il travaille la rapidité une fois la méthode comprise ; chaque erreur ajoute 5 secondes, donc la justesse reste la priorité. Si vous sentez de la pression, revenez au mode normal.</li>
    <li>La progression est enregistrée dans ce navigateur, sur cet appareil.</li></ul></div>
  <div class="box"><h3>Recommencer à zéro</h3>${confirmReset?`<p class="note">Toute la progression, les étoiles, les aliens, les temps et les fusées seront effacés.</p><div class="field" style="margin-top:10px"><button class="danger solid" data-act="reset-yes">Oui, tout effacer</button><button class="iconbtn" data-act="reset-no">Annuler</button></div>`:`<button class="danger" data-act="reset">Effacer la progression</button>`}</div></div>`;
  return h;
}

function render(){
  app.classList.toggle('playing',screen==='game');
  app.innerHTML=screen==='game'?viewGame():screen==='result'?viewResult():screen==='album'?viewAlbum():screen==='parents'?viewParents():screen==='hangar'?viewHangar():viewHome();
}

/* =========================================================
   Interactions
   ========================================================= */
function press(k){
  if(screen!=='game'||!M)return;
  if(M.phase==='solution'){if(k==='ok')nextQ();return}
  if(M.phase!=='ask')return;
  if(k==='del')M.input=M.input.slice(0,-1);
  else if(k==='ok'){submit();return}
  else if(M.input.length<2)M.input=(M.input==='0'?'':M.input)+k;
  if(M.msgCls==='bad'&&M.input)M.msg='';
  sfx.key();render();
}

app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.key){press(b.dataset.key);return}
  if(b.dataset.go){startMission(b.dataset.go);window.scrollTo(0,0);return}
  if(b.dataset.chrono){startMission(b.dataset.chrono,true);window.scrollTo(0,0);return}
  if(b.dataset.ship){S.ship=b.dataset.ship;save();render();return}
  if(b.dataset.nav){screen=b.dataset.nav;M=screen==='home'?null:M;confirmReset=false;render();window.scrollTo(0,0);return}
  const a=b.dataset.act;
  if(a==='sound'){S.sound=!S.sound;save();render()}
  else if(a==='blocks'){M.aid=M.aid==='blocks'?false:'blocks';render()}
  else if(a==='cols'){M.aid=M.aid==='hint'?false:'hint';render()}
  else if(a==='next')nextQ();
  else if(a==='savename'){S.name=(document.getElementById('kidname').value||'').trim().slice(0,20);save();b.textContent='Enregistré ✓'}
  else if(a==='reset'){confirmReset=true;render()}
  else if(a==='reset-no'){confirmReset=false;render()}
  else if(a==='reset-yes'){const keep=S.sound;S=fresh();S.sound=keep;save();confirmReset=false;screen='home';render()}
});
document.addEventListener('keydown',e=>{
  if(screen!=='game'||e.target.tagName==='INPUT')return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace'){e.preventDefault();press('del')}
  else if(e.key==='Enter'){e.preventDefault();press('ok')}
});

/* chrono : affichage en direct, pause quand l'appli passe en arrière-plan */
setInterval(()=>{if(screen!=='game'||!M||!M.timed)return;const el=document.getElementById('clock');if(el)el.textContent=fmt(clockMs())},100);
document.addEventListener('visibilitychange',()=>{
  if(!M||!M.timed||screen!=='game'||M.phase!=='ask')return;
  if(document.hidden){M.elapsed+=performance.now()-M.tick;M.paused=true}
  else{M.tick=performance.now();M.paused=false}
});

/* ciel étoilé */
(function(){const sky=document.getElementById('sky');let h='';for(let i=0;i<70;i++){const s=Math.random()<.15?3:2;h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;animation-delay:${(Math.random()*3).toFixed(2)}s"></i>`}sky.innerHTML=h})();

/* reprise d'une mission en cours après une mise à jour de la page */
function start(data){
  if(data&&data.M&&data.screen==='game'){M=data.M;screen='game';if(M.timed){M.tick=performance.now();M.paused=false}}
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({M,screen}))}catch(e){}}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>

</html>
