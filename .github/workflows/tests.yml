# Vérifie la logique du jeu et les numéros de version des fichiers à chaque envoi et pull request.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logique des questions
        run: node tests/logic.test.js
      - name: Numéros de version à jour dans index.html
        run: python3 tools/build.py --check
